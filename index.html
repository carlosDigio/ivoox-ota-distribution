<!DOCTYPE html>
<script src="https://cdn.jsdelivr.net/npm/plist@3.1.0/dist/plist.js"></script>
<html>
  <body>
    <img id="app-icon" src="" alt="iVoox icon" width="120" height="120"
      style="border-radius: 26px; display: none;" />
    <h1 id="main-title">Instalar iVoox</h1>
    <a id="install-btn"
      href="itms-services://?action=download-manifest&url=https://raw.githubusercontent.com/carlosDigio/ivoox-ota-distribution/main/manifest.plist"
      style="
        font-size: 32px;
        padding: 16px 32px;
        display: inline-block;
        text-decoration: none;
        background: #007aff;
        color: white;
        border-radius: 12px;">
      Instálame!
    </a>

    <script>
      fetch('https://raw.githubusercontent.com/carlosDigio/ivoox-ota-distribution/main/manifest.plist')
        .then(res => res.text())
        .then(xmlText => {
          const xml = new DOMParser().parseFromString(xmlText, 'text/xml');
          const keys = xml.querySelectorAll('key');

          keys.forEach(key => {
            // Versión
            if (key.textContent === 'bundle-version') {
              const version = key.nextElementSibling.textContent;
              document.getElementById('main-title').textContent = `Instalar iVoox ${version}`;
              document.getElementById('install-btn').textContent = `Instálame! ${version}`;
            }

            // Icono: busca el dict que tenga kind = display-image y coge su url
            if (key.textContent === 'kind' && key.nextElementSibling.textContent === 'display-image') {
              // La url está en el mismo dict, como siguiente par key/value
              const parentDict = key.parentElement;
              const siblingKeys = parentDict.querySelectorAll('key');
              siblingKeys.forEach(k => {
                if (k.textContent === 'url') {
                  const iconUrl = k.nextElementSibling.textContent;
                  const img = document.getElementById('app-icon');
                  img.src = iconUrl;
                  img.style.display = 'block';
                }
              });
            }
          });
        });
    </script>
  </body>
</html>
