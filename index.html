<!DOCTYPE html>
<script src="https://cdn.jsdelivr.net/npm/plist@3.1.0/dist/plist.js"></script>
<html>
  <body>
    <img id="app-icon" src="" alt="iVoox icon" width="50" height="50" style="display: inline;" />
    <h1 id="main-title">Instalar iVoox</h1>
    <a id="install-btn"
      href="itms-services://?action=download-manifest&url=https://raw.githubusercontent.com/carlosDigio/ivoox-ota-distribution/main/manifest.plist"
      style="
        font-size: 32px;
        padding: 16px 32px;
        display: inline-block;
        text-decoration: none;
        background: #007aff;
        color: white;
        border-radius: 12px;">
      Instálame!
    </a>
    <script>
      fetch('https://raw.githubusercontent.com/carlosDigio/ivoox-ota-distribution/main/DistributionSummary.plist')
        .then(res => res.text())
        .then(xmlText => {
          const xml = new DOMParser().parseFromString(xmlText, 'text/xml');
          const rootDict = xml.querySelector('plist > dict > array > dict');
          const keys = rootDict.querySelectorAll(':scope > key');

          let versionNumber = "";
          let buildNumber = "";

          keys.forEach(key => {
            if (key.textContent === 'versionNumber') {
              versionNumber = key.nextElementSibling.textContent;
            }
            if (key.textContent === 'buildNumber') {
              buildNumber = key.nextElementSibling.textContent;
            }
          });

          document.getElementById('main-title').textContent = `Instalar iVoox v${versionNumber} (${buildNumber})`;
        });
    </script>
    <script>
      fetch('https://raw.githubusercontent.com/carlosDigio/ivoox-ota-distribution/main/manifest.plist')
        .then(res => res.text())
        .then(xmlText => {
          const xml = new DOMParser().parseFromString(xmlText, 'text/xml');
          const keys = xml.querySelectorAll('key');

          keys.forEach(key => {
            if (key.textContent === 'kind' && key.nextElementSibling.textContent === 'display-image') {
              const parentDict = key.parentElement;
              const siblingKeys = parentDict.querySelectorAll('key');
              siblingKeys.forEach(k => {
                if (k.textContent === 'url') {
                  const iconUrl = k.nextElementSibling.textContent;
                  const img = document.getElementById('app-icon');
                  img.src = iconUrl;
                  img.style.display = 'block';
                }
              });
            }
          });
        });
    </script>
  </body>
</html>
